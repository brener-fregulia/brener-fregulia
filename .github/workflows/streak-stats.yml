name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

concurrency:
  group: update-streak-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=brener-fregulia&theme=dark&hide_border=false&border_radius=4.5&card_width=700&mode=daily&disable_animations=true"
          path: profile/streak.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar"
            exit 0
          fi

          git commit -m "Update streak stats"
          git pull --rebase origin main
          git push origin HEAD:main
